# Puts a real `dsh` and `pnpm` on PATH for the checks that install the package
# instead of reading it.
#
# Two numbers, both measured on windows-latest with the same 654 packages:
#
#   npm install --global pnpm @deepseek-ai/dsh          13 min 16 s
#   npm i -g --prefix "$RUNNER_TEMP/dsh-launcher" ...      64 s
#
# The first writes into the runner's default prefix on C:; the second writes to
# the temp drive. Nothing else differs. If this step ever goes back to the
# default prefix, expect it to spend a quarter of an hour here.
#
# A version-keyed cache of the prefix was tried and removed: restoring the 197 MB
# entry took 40 s against the 64 s install, so it bought half a minute for a
# cache to invalidate, a probe to keep honest, and a second copy of the launcher
# version to keep in sync.
name: dsh launcher
description: Install the real dsh launcher and pnpm into the runner temp dir, and put them on PATH.

inputs:
  prefix:
    description: |
      Directory to install into. Must be on the temp drive for the 64 s figure
      above; `$RUNNER_TEMP` is not readable here (the `runner` context is not
      available in action metadata), so the workflow passes the path in.
    required: true

outputs:
  version:
    description: The launcher version on PATH after this action.
    value: ${{ steps.install.outputs.version }}

runs:
  using: composite
  steps:
    - name: Install the launcher and put it on PATH
      id: install
      shell: bash
      env:
        PREFIX: ${{ inputs.prefix }}
      run: |
        set -euo pipefail

        start=$SECONDS
        npm i -g --prefix "$PREFIX" pnpm @deepseek-ai/dsh
        echo "installed in $((SECONDS - start))s"

        # npm puts the shims straight into the prefix on Windows, and into
        # `bin/` everywhere else. One of these exists after an install.
        if [ -f "$PREFIX/bin/dsh" ]; then bin="$PREFIX/bin"; else bin="$PREFIX"; fi

        # Run it before handing it to the next step: a launcher on PATH that
        # cannot start would fail later, inside the package check, looking like
        # the plugin's fault.
        version="$( "$bin/dsh" -V )"
        echo "dsh $version, pnpm $( "$bin/pnpm" -v )"
        echo "version=$version" >> "$GITHUB_OUTPUT"

        echo "$bin" >> "$GITHUB_PATH"
