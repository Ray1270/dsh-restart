# Publishing. Pushing a tag is the only thing that creates a release, and the
# tarball attached to that release is the one this job packed and tested — not a
# file uploaded by hand from someone's laptop.
#
#   git tag v0.3.3 && git push origin v0.3.3
#
# Order matters: the tag is checked against package.json first, then the suites
# run on exactly the tree that will ship, and only then is anything packed. A red
# suite publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  # Recovery path: re-run the pipeline for a tag that already exists, e.g. after
  # fixing a flaky step, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.3.3
        required: true
        type: string

# `gh release create` writes to the repository; the token needs nothing else.
permissions:
  contents: write

# A tag is immutable, so these runs are cheap enough to leave alone — cancelling
# one mid-flight would leave half a release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# One dialect for every step. The runner's default shell is pwsh, and the pack
# step is plain shell; keeping all of them bash means no quoting surprises.
defaults:
  run:
    shell: bash

jobs:
  release:
    # Windows, for the same reason CI is: the helper suite drives WMI and inspects
    # real windows, none of which exists on Linux.
    runs-on: windows-latest
    # A step that hangs is a release that never happens and a run that occupies
    # the queue for hours. The whole job takes about two minutes when healthy.
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and every tag: the release body is built from the
          # commits between the previous tag and this one.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # The tag is a claim about what is in the box. Check the claim first.
      - name: The tag must name the packaged version
        run: node scripts/release-check.mjs "$TAG"

      - name: Run the suites
        run: npm test

      # Needed by the install check below. Cached by launcher version, so this is
      # a restore rather than a 13-minute global install — see the action's own
      # comment for the measurement.
      - uses: ./.github/actions/launcher
        with:
          prefix: ${{ runner.temp }}/dsh-launcher

      # One step on purpose. Splitting pack / notes / publish across steps means
      # values travel through step outputs and the working tree, and a step that
      # half-succeeds is reported as "success" while leaving an empty file behind
      # for the next step to publish. v0.3.3 was published twice that way: first
      # with a body GitHub generated from pull requests that do not exist, then
      # with no body at all.
      - name: Pack, describe and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          npm pack --json > pack.json
          tgz="$(node -p "require('./pack.json')[0].filename")"
          sha256sum "$tgz" > "$tgz.sha256"

          # Everything above tests the source tree. This tests the thing people
          # download: unpack the tarball, check that everything package.json
          # promises is inside it, and run the packed host and client halves
          # against their own smoke tests. `files` and the bundle patch are only
          # exercised by shipping a package — the tree can be perfect while the
          # package is missing a file.
          node scripts/package-check.mjs --tarball "$tgz"

          # And this tests the thing people do: install it. A throwaway profile
          # under a throwaway $DSH_HOME, through the real launcher, then ask the
          # launcher to compose the profile and read back what it composed. The
          # launcher has to be installed for that, which is why the step above
          # restores it from cache first.
          node scripts/install-check.mjs --tarball "$tgz"

          # The body comes from the commits between the previous tag and this one,
          # not from `gh --generate-notes`: that reads only merged pull requests,
          # and this repository is pushed to directly.
          node scripts/release-notes.mjs "$TAG" > release-notes.md

          # An annotated tag's first line is the human title of this release.
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          [ -n "$title" ] || title="$TAG"

          # Everything the release is about to say, in the run summary. The job log
          # needs a token to read; the summary does not, and "what did it actually
          # send" is the first question when a release comes out wrong.
          {
            echo "### $TAG"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| title | \`$title\` |"
            echo "| tarball | \`$tgz\` ($(wc -c < "$tgz") bytes) |"
            echo "| notes | $(wc -c < release-notes.md) bytes |"
            echo "| tags visible | \`$(git tag -l | tr '\n' ' ')\` |"
            echo "| node / gh | $(node --version) / $(gh --version | head -1) |"
            echo
            echo '```'
            cat "$tgz.sha256"
            echo '```'
            echo
            head -6 release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          # Never publish an empty body or an empty title. Both have happened.
          test -s release-notes.md
          test -n "$title"

          # Delete and re-create rather than edit in place.
          #
          # Editing was the wrong idea twice over. First, a half-finished edit left
          # the release with no body. Then, after the tag was moved to a new commit,
          # the existing release was no longer reachable through the public API —
          # `gh release view` still found it with a token, so `gh release edit`
          # reported success while updating a release that was a draft, and no
          # amount of successful edits made it visible.
          #
          # Re-creating makes the published state a function of this run alone: it
          # exists, it is public, and its body is the file above.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "replacing the existing release for $TAG"
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$tgz" "$tgz.sha256" \
            --title "$title" --notes-file release-notes.md --verify-tag

          # Verified, not assumed: the release must be public and non-empty.
          draft="$(gh release view "$TAG" --json isDraft -q .isDraft)"
          bodylen="$(gh release view "$TAG" --json body -q .body | wc -c)"
          echo "published $TAG: draft=$draft, body=$bodylen bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$draft" != "false" ] || [ "$bodylen" -lt 100 ]; then
            echo "::error::release $TAG published badly: draft=$draft body=$bodylen bytes"
            exit 1
          fi
