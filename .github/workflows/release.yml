# Publishing. Pushing a tag is the only thing that creates a release, and the
# tarball attached to that release is the one this job packed and tested — not a
# file uploaded by hand from someone's laptop.
#
# The same tarball is mirrored to npm: nothing is rebuilt for it,
# `npm publish ./<file>.tgz` ships the file that was just attached, and the
# archive npm serves is then compared with that file's checksum byte for byte.
# The route is npm trusted publishing — this job trades its GitHub OIDC token for
# a short-lived npm credential, so the repository holds no npm secret and every
# publish carries a provenance attestation. An NPM_TOKEN secret still works as a
# fallback; see the npm block at the end of `Pack, describe and publish`.
#
#   git tag v0.3.3 && git push origin v0.3.3
#
# Order matters: the tag is checked against package.json first, then the suites
# run on exactly the tree that will ship, and only then is anything packed. A red
# suite publishes nothing.
name: Release

on:
  push:
    tags: ['v*']
  # Recovery path: re-run the pipeline for a tag that already exists, e.g. after
  # fixing a flaky step, without moving the tag.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, e.g. v0.3.3
        required: true
        type: string

# `gh release create` writes to the repository. `id-token: write` is the OIDC
# half of npm trusted publishing: without it the CLI has nothing to trade for a
# publish credential. It grants no other repository access.
permissions:
  contents: write
  id-token: write

# A tag is immutable, so these runs are cheap enough to leave alone — cancelling
# one mid-flight would leave half a release behind.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# One dialect for every step. The runner's default shell is pwsh, and the pack
# step is plain shell; keeping all of them bash means no quoting surprises.
defaults:
  run:
    shell: bash

jobs:
  release:
    # Windows, for the same reason CI is: the helper suite drives WMI and inspects
    # real windows, none of which exists on Linux.
    runs-on: windows-latest
    # A step that hangs is a release that never happens and a run that occupies
    # the queue for hours. The whole job takes about two minutes when healthy.
    timeout-minutes: 30
    env:
      TAG: ${{ inputs.tag || github.ref_name }}

    steps:
      - uses: actions/checkout@v7
        with:
          # Full history and every tag: the release body is built from the
          # commits between the previous tag and this one.
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref_name }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # The tag is a claim about what is in the box. Check the claim first.
      - name: The tag must name the packaged version
        run: node scripts/release-check.mjs "$TAG"

      - name: Run the suites
        run: npm test

      # Needed by the install check below, and about a minute — see the action's
      # own comment for what makes it a minute rather than a quarter of an hour.
      - uses: ./.github/actions/launcher
        with:
          prefix: ${{ runner.temp }}/dsh-launcher

      # One step on purpose. Splitting pack / notes / publish across steps means
      # values travel through step outputs and the working tree, and a step that
      # half-succeeds is reported as "success" while leaving an empty file behind
      # for the next step to publish. v0.3.3 was published twice that way: first
      # with a body GitHub generated from pull requests that do not exist, then
      # with no body at all.
      - name: Pack, describe and publish
        env:
          GH_TOKEN: ${{ github.token }}
          # Fallback only, empty unless someone adds the secret. The npm block at
          # the end of this step prefers trusted publishing and reads this only
          # when it is set.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          npm pack --json > pack.json
          tgz="$(node -p "require('./pack.json')[0].filename")"
          sha256sum "$tgz" > "$tgz.sha256"

          # Everything above tests the source tree. This tests the thing people
          # download: unpack the tarball, check that everything package.json
          # promises is inside it, and run the packed host and client halves
          # against their own smoke tests. `files` and the bundle patch are only
          # exercised by shipping a package — the tree can be perfect while the
          # package is missing a file.
          node scripts/package-check.mjs --tarball "$tgz"

          # And this tests the thing people do: install it. A throwaway profile
          # under a throwaway $DSH_HOME, through the real launcher, then ask the
          # launcher to compose the profile and read back what it composed.
          node scripts/install-check.mjs --tarball "$tgz"

          # The body comes from the commits between the previous tag and this one,
          # not from `gh --generate-notes`: that reads only merged pull requests,
          # and this repository is pushed to directly.
          node scripts/release-notes.mjs "$TAG" > release-notes.md

          # An annotated tag's first line is the human title of this release.
          title="$(git for-each-ref --format='%(contents:subject)' "refs/tags/$TAG")"
          [ -n "$title" ] || title="$TAG"

          # Everything the release is about to say, in the run summary. The job log
          # needs a token to read; the summary does not, and "what did it actually
          # send" is the first question when a release comes out wrong.
          {
            echo "### $TAG"
            echo
            echo "| | |"
            echo "| --- | --- |"
            echo "| title | \`$title\` |"
            echo "| tarball | \`$tgz\` ($(wc -c < "$tgz") bytes) |"
            echo "| notes | $(wc -c < release-notes.md) bytes |"
            echo "| tags visible | \`$(git tag -l | tr '\n' ' ')\` |"
            echo "| node / npm / gh | $(node --version) / $(npm --version) / $(gh --version | head -1) |"
            echo
            echo '```'
            cat "$tgz.sha256"
            echo '```'
            echo
            head -6 release-notes.md
          } >> "$GITHUB_STEP_SUMMARY"

          # Never publish an empty body or an empty title. Both have happened.
          test -s release-notes.md
          test -n "$title"

          # Delete and re-create rather than edit in place.
          #
          # Editing was the wrong idea twice over. First, a half-finished edit left
          # the release with no body. Then, after the tag was moved to a new commit,
          # the existing release was no longer reachable through the public API —
          # `gh release view` still found it with a token, so `gh release edit`
          # reported success while updating a release that was a draft, and no
          # amount of successful edits made it visible.
          #
          # Re-creating makes the published state a function of this run alone: it
          # exists, it is public, and its body is the file above.
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "replacing the existing release for $TAG"
            gh release delete "$TAG" --yes
          fi

          gh release create "$TAG" "$tgz" "$tgz.sha256" \
            --title "$title" --notes-file release-notes.md --verify-tag

          # Verified, not assumed: the release must be public and non-empty.
          draft="$(gh release view "$TAG" --json isDraft -q .isDraft)"
          bodylen="$(gh release view "$TAG" --json body -q .body | wc -c)"
          echo "published $TAG: draft=$draft, body=$bodylen bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$draft" != "false" ] || [ "$bodylen" -lt 100 ]; then
            echo "::error::release $TAG published badly: draft=$draft body=$bodylen bytes"
            exit 1
          fi

          # ---------------------------------------------------------------- npm
          #
          # Everything above proved the tarball; this puts it where
          # `dsh plugin add @ray1270/dsh-restart` finds it. Deliberately last, so
          # the failure modes stay ordered: a bad tarball stops before the
          # release, a bad npm publish stops after it, and the run is red either
          # way.
          #
          # Two ways in:
          #
          #   trusted publishing (default)  npmjs.com is configured to trust this
          #                                 repository and this workflow file; the
          #                                 CLI trades the runner's OIDC token for a
          #                                 credential good for one publish, and
          #                                 --provenance attaches a signed
          #                                 attestation to the tarball. Needs
          #                                 `id-token: write` and npm >= 11.5.2.
          #                                 Nothing to leak, nothing to rotate.
          #   NPM_TOKEN                     the escape hatch from the previous
          #                                 round, still honoured when the secret
          #                                 exists.
          #
          # Unlike the previous round, a publish that did not happen is a red
          # run: npm is an advertised install path now, so "npm does not have it"
          # is a broken release rather than a registry this project does not
          # depend on. The one case that stays green is "nothing is configured at
          # all" — no OIDC, no secret — because that is a tag pushed from a
          # machine that has no business publishing.
          #
          # What this block proves, in every case it can, is not "a version
          # exists" but "npm serves the bytes this release attached". See
          # verify_served below.
          version="$(node -p "require('./package.json').version")"
          name="$(node -p "require('./package.json').name")"
          spec="$name@$version"

          registry="$(npm config get registry)"
          registry="${registry%/}"
          # @scope/name -> @scope%2fname, the path npm's own client uses.
          escaped="$(node -p "const n = process.argv[1]
            const i = n.indexOf('/')
            process.stdout.write(i < 0 ? n : n.slice(0, i) + '%2f' + n.slice(i + 1))" "$name")"

          # The version document, fetched past every cache in the way.
          #
          # Reading the packument (`npm view`) is not good enough here, and that
          # cost a red run to learn: on v0.3.7 the publish succeeded, but the
          # CDN kept answering with the copy it already had, so a 15-second
          # retry loop reported "npm does not serve it yet" for a version that
          # appeared two minutes later. The nonce makes the URL unique, so no
          # layer in between can answer from cache.
          version_doc() {
            curl -fsS --max-time 20 -H 'Cache-Control: no-cache' \
              "$registry/$escaped/$version?t=$(date +%s%N)" 2>/dev/null
          }

          # Publishing is not the thing worth asserting; the bytes are. This runs
          # on both paths — published a second ago, or published by an earlier
          # run of the same tag — because the claim being checked is identical.
          #
          # `npm publish <file>` sends that file (pacote streams the tarball
          # rather than repacking it), so this should hold. It is checked anyway:
          # "should" is what the previous three releases were built on.
          verify_served() {
            local route="$1" served want got
            served="$(printf '%s' "$body" | node -p "JSON.parse(require('fs').readFileSync(0)).dist.tarball")"
            if [ -z "$served" ]; then
              echo "::error::npm has $spec but its document names no tarball"
              exit 1
            fi
            curl -fsSL "$served" -o npm-served.tgz
            want="$(cut -d' ' -f1 "$tgz.sha256")"
            got="$(sha256sum npm-served.tgz | cut -d' ' -f1)"
            echo "npm: $served -> sha256 $got"
            if [ "$want" != "$got" ]; then
              echo "::error::npm serves $got, the release attaches $want — the tag and npm disagree about $version"
              exit 1
            fi
            echo "npm: $spec ($route), sha256 matches the release ($got)" | tee -a "$GITHUB_STEP_SUMMARY"
          }

          if body="$(version_doc)"; then
            # Already published. Not a reason to skip the check — a re-run of the
            # same tag is exactly when "is npm still the file this release
            # attaches" is worth asking.
            echo "npm: $spec is already there — checking the bytes" | tee -a "$GITHUB_STEP_SUMMARY"
            verify_served "already published"
          elif [ -z "${NPM_TOKEN:-}" ] && [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "npm: no trusted publisher and no NPM_TOKEN here — $spec stays unpublished there" \
              | tee -a "$GITHUB_STEP_SUMMARY"
          else
            if [ -n "${NPM_TOKEN:-}" ]; then
              # The token is written outside the checkout and only for this step,
              # so it can never reach a tarball, the summary, or `git status`.
              npmrc="$RUNNER_TEMP/npmrc"
              printf 'registry=https://registry.npmjs.org/\n//registry.npmjs.org/:_authToken=%s\n' \
                "$NPM_TOKEN" > "$npmrc"
              export NPM_CONFIG_USERCONFIG="$npmrc"
              route=NPM_TOKEN
              publish=(npm publish "./$tgz" --access public)
            else
              # The one requirement that is not about this repository: the CLI
              # learns trusted publishing in npm 11.5.2, and an older one fails
              # with a message about credentials that never mentions the version.
              npm_version="$(npm --version)"
              node -e 'const v = process.argv[1].split(".").map(Number);
                const ok = v[0] > 11 || (v[0] === 11 && (v[1] > 5 || (v[1] === 5 && v[2] >= 2)));
                process.exit(ok ? 0 : 1)' "$npm_version" || {
                echo "::error::trusted publishing needs npm >= 11.5.2, this runner has $npm_version"
                exit 1
              }
              route=OIDC
              publish=(npm publish "./$tgz" --access public --provenance)
            fi

            # stderr goes to a file outside the checkout, so a failure can name
            # its likely cause; it is printed either way, because npm's own words
            # are the part a red run needs.
            errfile="$RUNNER_TEMP/npm-publish.err"
            if ! "${publish[@]}" 2> "$errfile"; then
              cat "$errfile"
              if grep -qi 'trusted publisher' "$errfile"; then
                echo "::error::npm refused: this repository and workflow are not a trusted publisher for @ray1270/dsh-restart (npmjs.com → package → Trusted Publisher)"
              else
                echo "::error::npm publish failed for $spec (route: $route)"
              fi
              exit 1
            fi

            # Wait for the publish to become visible, then prove the bytes. Two
            # minutes is the v0.3.7 observation (published at 05:12:59, visible
            # at 05:14:35) with room on top; the numbers are overridable so the
            # rehearsal script can run this in one second instead of two minutes.
            attempts="${NPM_VISIBLE_ATTEMPTS:-24}"
            interval="${NPM_VISIBLE_SECONDS:-5}"
            visible=0
            for _ in $(seq 1 "$attempts"); do
              if body="$(version_doc)"; then
                visible=1
                break
              fi
              sleep "$interval"
            done
            if [ "$visible" = "0" ]; then
              # Worth saying plainly, because the opposite is the likelier case:
              # the publish usually worked and only the CDN is behind.
              echo "::error::published $spec but npm does not serve it after $((attempts * interval))s — if the version shows up, re-run this workflow and it will be checked instead of republished"
              exit 1
            fi
            verify_served "$route"
          fi
