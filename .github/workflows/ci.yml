# Continuous integration: runs the exact command a contributor runs locally.
#
# Windows only, because the package is Windows only — the restart helper is a
# PowerShell script the WMI service launches outside the application's process
# tree, and the suites drive it for real. A Linux leg would prove nothing this
# package claims, and a leg that has never passed is how a first CI run goes red
# for a reason nobody has evidence about.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Read-only: the suites build and drive throwaway processes, they never write
# back to the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test (${{ matrix.os }} / node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # The package targets ^22.19.0 || >=24.0.0 (see package.json engines).
          - os: windows-latest
            node: '24'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No dependencies and no build step: the three suites run straight from
      # the checkout with the runner's own Node.
      - name: Run the suites
        run: npm test

      # A release must never ship a tree that does not pack.
      - name: Verify the package tarball
        run: npm pack --dry-run

  # The suites above read the source tree. This installs the packed tarball with
  # the real launcher, into a profile that never existed — the one check that
  # asks what a user actually gets, rather than what the tree contains.
  #
  # It is a separate job on purpose: the launcher cache is a minute of setup that
  # the suites do not need, and a red suite should not wait behind it.
  install:
    name: Install the tarball (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Cached by launcher version: see .github/actions/launcher/action.yml for
      # why this is not a 13-minute `npm i -g` on every push.
      - uses: ./.github/actions/launcher
        with:
          prefix: ${{ runner.temp }}/dsh-launcher
          os: ${{ runner.os }}

      - name: Prove the launcher is reachable the way the check will use it
        run: |
          set -euo pipefail
          echo "dsh $(dsh -V) / pnpm $(pnpm -v) / $(command -v dsh)"

      - name: Install into a fresh profile and compose it
        run: node scripts/install-check.mjs
